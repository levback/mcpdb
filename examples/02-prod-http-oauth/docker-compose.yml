services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example # Local dev only.
      POSTGRES_USER: mcpdb
      POSTGRES_DB: app
    ports:
      - "5432:5432"

  mcpdb:
    image: python:3.13-slim
    working_dir: /workspace
    depends_on:
      - postgres
    volumes:
      - ../../:/workspace
    command: ["sh", "-lc", "uv run python -m mcpdb.cli serve --transport http --host 0.0.0.0 --port 8080 --config examples/02-prod-http-oauth/mcpdb.yaml"]
    ports:
      - "8080:8080"
