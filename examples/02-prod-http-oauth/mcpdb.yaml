profiles:
  - name: primary
    backend: postgres
    host: postgres
    port: 5432
    database: app
    username: mcpdb
    password: ${env:PG_PASSWORD}
    mode: read_only
limits:
  query_timeout_ms: 3000
  max_rows: 500
security:
  auth_enabled: true
  bind_host: 0.0.0.0
  issuer: https://auth.example
  audience: mcpdb
policy_file: examples/02-prod-http-oauth/policy.yaml
