services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: mcpdb
      POSTGRES_DB: app
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  mcpdb:
    image: python:3.13-slim
    working_dir: /workspace
    depends_on:
      - postgres
      - mongo
    environment:
      PG_PASSWORD: example
      AUDIT_CHAIN_KEY: demo-key-do-not-use-in-production
    volumes:
      - ../../:/workspace
    command: ["sh", "-lc", "uv run python -m mcpdb.cli serve --transport http --host 0.0.0.0 --port 8081 --config examples/03-multimodal-audit/mcpdb.yaml"]
    ports:
      - "8081:8081"
