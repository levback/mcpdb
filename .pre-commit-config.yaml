minimum_pre_commit_version: 4.5.0
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-r, src, -lll]
        pass_filenames: false
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src --strict
        language: system
        pass_filenames: false
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false