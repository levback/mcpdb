[project]
name = "mcpdb"
version = "0.1.0"
description = "Model Context Protocol database server scaffolding"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.28.0",
    "mcp>=1.2,<2",
    "motor>=3.5.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.7,<3",
    "pydantic-settings[yaml]>=2.7,<3",
    "pyjwt[crypto]>=2.10.0",
    "rich>=14.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "starlette>=0.47.0",
    "structlog>=25.4.0",
    "typer>=0.16.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
mcpdb = "mcpdb.cli.app:entrypoint"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "hypothesis>=6.130.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mutmut>=2.5.0",
    "mypy>=1.16.0",
    "pip-audit>=2.9.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.0",
    "respx>=0.22.0",
    "ruff>=0.12.0",
    "safety>=3.2.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mcpdb"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mcpdb"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests"]
targets = ["src"]
